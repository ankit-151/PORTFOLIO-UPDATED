services:
  # ─── Backend API (Node.js + Express) ─────────────────────────────────
  - type: web
    name: ankit-portfolio-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Set this in Render Dashboard → Environment
      - key: JWT_SECRET
        sync: false          # Set this in Render Dashboard → Environment
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false          # e.g. https://your-app.vercel.app
      - key: ADMIN_URL
        sync: false          # e.g. https://your-admin.vercel.app
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
